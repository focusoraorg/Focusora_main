<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Focusora - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="logo-container">
      <img src="logo.png" alt="Focusora Logo" class="logo-img" />
    </div>
    <div class="theme-toggle-container">
      <button id="theme-toggle" class="theme-toggle">
        <i class="fas fa-sun"></i>
        <i class="fas fa-moon"></i>
      </button>
    </div>
    <div class="user-profile">
      <div class="user-info">
        <span class="user-name" id="user-name">Loading...</span>
        <span class="user-plan" id="user-plan">Free Plan</span>
      </div>
      <div class="user-avatar">
        <img id="user-avatar" src="https://via.placeholder.com/40" alt="User Avatar">
      </div>
    </div>
  </header>

  <div class="dashboard-container">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i><span>Dashboard</span></a>
        <a href="#" class="nav-item"><i class="fas fa-tasks"></i><span>To-Do List</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Insights</span></a>
        <a href="#" class="nav-item"><i class="fas fa-trophy"></i><span>Rewards</span></a>
        <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="b2b.html" class="nav-item"><i class="fas fa-building"></i><span>For Institutions</span></a>
        <a href="#" id="logout-btn" class="nav-item"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
      </div>
    </aside>

    <main class="main-content">
      <div class="welcome-section">
        <h1>Welcome back, <span id="welcome-name">User</span>!</h1>
        <p>Here’s your productivity summary</p>
      </div>

      <section class="stats-overview">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-info">
            <h3>Focus Time</h3>
            <p class="stat-value" id="focus-time-stat">0h 0m</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-star"></i></div>
          <div class="stat-info">
            <h3>XP Earned</h3>
            <p class="stat-value" id="xp-earned-stat">0 XP</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-info">
            <h3>Sessions</h3>
            <p class="stat-value" id="sessions-completed-stat">0</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-fire"></i></div>
          <div class="stat-info">
            <h3>Streak</h3>
            <p class="stat-value" id="streak-stat">0 days</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>

  <script>
  // Auth and Firestore instances declared only ONCE
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "index.html"; // redirect if not logged in
    } else {
      // Show basic user info
      document.getElementById('user-name').textContent = user.displayName || user.email;
      document.getElementById('welcome-name').textContent = user.displayName || "User";
      document.getElementById('user-avatar').src = user.photoURL || "https://via.placeholder.com/40";

      // Live listener for user profile data
      db.collection("users").doc(user.uid).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('user-plan').textContent =
            data.plan ? `${data.plan.charAt(0).toUpperCase() + data.plan.slice(1)} Plan` : "Free Plan";
          document.getElementById('xp-earned-stat').textContent = (data.xp || 0) + " XP";
          document.getElementById('streak-stat').textContent = (data.streak || 0) + " days";
        }
      });

      // Live listener for sessions collection
      db.collection("users").doc(user.uid).collection("sessions")
        .onSnapshot(snapshot => {
          let totalSessions = snapshot.size;
          let totalMinutes = 0;
          snapshot.forEach(doc => {
            const session = doc.data();
            if (session.duration) totalMinutes += session.duration / 60; // sec → min
          });
          const hours = Math.floor(totalMinutes / 60);
          const minutes = Math.floor(totalMinutes % 60);
          document.getElementById('focus-time-stat').textContent = `${hours}h ${minutes}m`;
          document.getElementById('sessions-completed-stat').textContent = totalSessions;
        });
    }
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', () => {
    auth.signOut().then(() => {
      window.location.href = "index.html";
    });
  });
  </script>
</body>
</html>
