<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focusora</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h1>📚 Focusora</h1>

    <!-- Greeting Section -->
    <div class="card">
      <h2>Welcome</h2>
      <input type="text" id="nameInput" placeholder="What's Your Name" />
      <button id="saveName">Save</button>
    </div>

    <!-- Theme Toggle -->
    <div class="card">
      <h2>Toggle Theme</h2>
      <button id="themeToggle">🌓 Toggle Theme</button>
    </div>

    <!-- To-Do List -->
    <div class="card">
      <h2>To-Do List</h2>
      <input type="text" id="taskInput" placeholder="Add Your Tasks" />
      <button id="addTask">Add</button>
      <ul id="taskList"></ul>
    </div>

    <!-- Pomodoro Timer -->
    <div class="card">
      <h2>Pomodoro Timer</h2>
      <div id="timer">00m: 00s</div>
      <div class="btn-row">
        <button id="startTimer">Start</button>
        <button id="resetTimer">Reset</button>
      </div>
    </div>

    <!-- Calm Music -->
    <div class="card">
      <h2>Music</h2>
      <audio controls loop>
        <source src="audio/calm.mp3" type="audio/mpeg" />
      </audio>
    </div>

    <!-- Wikipedia Search -->
    <div class="card">
      <h2>Ask Wikipedia</h2>
      <div class="search-row">
        <input type="text" id="wikiInput" placeholder="Type a topic..." />
        <button id="wikiSearch">Search</button>
      </div>
    </div>

    <!-- Distraction Count -->
    <div class="card">
      <h2>Distraction Tracker</h2>
      <p>You got distracted <strong id="distractionCount">0</strong> time(s) today 😅</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
<iframe 
  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>
